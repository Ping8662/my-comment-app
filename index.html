<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>班級 AI 評語微調與學期記錄助手</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
body{background:#f6f1e7;color:#4a4540;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.card{background:#fffdf8;border-radius:1rem;box-shadow:0 2px 12px #8a7f6a26;padding:1rem}
.btn{border-radius:.75rem;padding:.45rem .9rem;font-weight:600;color:#fff;background:#8f9e8b;transition:.15s;font-size:.9rem}
.btn:hover{filter:brightness(.93);transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:wait}
.alt{background:#b08d7d}.gray{background:#a3a09a}.blue{background:#7d93a8}
.inp{width:100%;border:1px solid #e0d8c8;border-radius:.6rem;padding:.4rem .6rem;background:#fff;font-size:.9rem}
.inp:focus{outline:2px solid #b9c7b4}
.chip{display:inline-block;margin:2px;padding:2px 10px;border-radius:999px;font-size:.8rem;cursor:pointer;transition:.15s}
.chip:hover{transform:scale(1.07)}
.hist{border-left:3px solid #c9b79c;padding-left:.5rem;margin:.35rem 0;font-size:.8rem}
.tab{padding:.4rem 1rem;border-radius:.75rem;font-weight:600;cursor:pointer}.tab.on{background:#8f9e8b;color:#fff}
th{background:#ebe3d3;padding:.4rem;font-size:.85rem;position:sticky;top:0}td{padding:.4rem;vertical-align:top;border-bottom:1px solid #eadfca}
</style></head>
<body class="p-3 md:p-5">
<header class="flex flex-wrap items-center gap-2 mb-4">
  <h1 class="text-xl font-bold mr-2">🌿 班級 AI 評語微調與學期記錄助手</h1>
  <span id="tabs"></span><span id="cloud" class="text-xs text-stone-500 ml-1"></span>
  <div class="ml-auto flex flex-wrap gap-2">
    <button class="btn blue" onclick="A.exp()">⬇ 匯出備份</button>
    <label class="btn blue cursor-pointer">⬆ 匯入<input type="file" accept=".json" class="hidden" onchange="A.imp(this)"></label>
    <button class="btn alt" onclick="A.arch()">🎓 畢業封存</button>
    <button class="btn blue" id="lg" onclick="A.login()">🔐 Google 登入</button>
    <button class="btn gray" onclick="A.cfg(true)">⚙ 設定</button>
  </div>
</header>
<main id="app"></main>

<div id="modal" class="hidden fixed inset-0 bg-black/30 flex items-center justify-center p-3 z-40">
  <div class="card w-full max-w-2xl max-h-[92vh] overflow-auto space-y-2">
    <h2 class="font-bold text-lg">⚙ 設定（皆儲存於本機 LocalStorage）</h2>
    <label class="text-sm">Gemini API Key<input id="c_key" type="password" class="inp"></label>
    <label class="text-sm">Gemini 模型名稱<input id="c_model" class="inp" placeholder="gemini-2.5-flash"></label>
    <label class="text-sm">firebaseConfig（貼上 Firebase 控制台的 { apiKey:..., projectId:... } 物件）<textarea id="c_fb" rows="6" class="inp font-mono"></textarea></label>
    <label class="text-sm">學生名單（每行一位，依座號 1~N；保留原有資料依座號對應）<textarea id="c_roster" rows="8" class="inp"></textarea></label>
    <div class="flex gap-2 justify-end"><button class="btn gray" onclick="A.cfg(false)">取消</button><button class="btn" onclick="A.saveCfg()">儲存設定</button></div>
  </div>
</div>
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-stone-700 text-white px-4 py-2 rounded-xl text-sm hidden z-50"></div>

<script type="module">
const F=[['g5u','五上期末評語'],['c5','五年級春節卡片'],['g5d','五下期末評語'],['g6u','六上期末評語'],['c6','六年級春節卡片'],['g6d','六下期末評語']];
const T=[...F,['grad','六年級畢業卡片']];
const L=k=>T.find(x=>x[0]===k)[1];
const DEF={
 '學習亮點':{color:'#dfe8d8',list:['上課專注','積極發言','閱讀進步','數學思路清晰','作業認真','樂於探索','書寫工整','進步明顯']},
 '幹部表現':{color:'#e8dccf',list:['盡責的小老師','值日生負責','帶領同學有責任感','主動幫忙','熱心服務','守時守規矩']},
 '溫柔提醒':{color:'#e6d5d5',list:['細心檢查可更好','課堂再專注些','鼓勵多舉手','整理習慣再加強','情緒管理再練習']},
 '祝福金句':{color:'#d6dfe8',list:['願你帶著自信前行','相信自己閃閃發光','新年平安喜樂','畢業快樂前程似錦','謝謝你陪我一年']}};
let S=JSON.parse(localStorage.getItem('cls_data')||'null')||{students:[],styles:[],tags:DEF,updated:0};
let C=JSON.parse(localStorage.getItem('cls_cfg')||'{}');
let view='one',cur=0,tgt='g6d',draft='',editT='',extraT='',edit=false,busy=false,bd={},kw={},cloud=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=(m,ms=2200)=>{const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('hidden'),ms)};

// ---------- 儲存與雲端 ----------
function save(){S.updated=Date.now();localStorage.setItem('cls_data',JSON.stringify(S));
 if(cloud)cloud.set(cloud.ref,{data:JSON.stringify(S),updated:S.updated}).then(()=>$('cloud').textContent='☁️ 已同步').catch(e=>{$('cloud').textContent='☁️ 同步失敗';toast('雲端寫入失敗：'+e.message,4000)});}
let au=null,unsubA=null,unsubS=null;
async function initCloud(){
 $('cloud').textContent='💻 僅本機儲存';cloud=null;$('lg').textContent='🔐 Google 登入';
 unsubA&&unsubA();unsubS&&unsubS();au=null;
 if(!C.fb)return;
 try{
  const cfg=new Function('return '+C.fb)();
  const {initializeApp,getApps}=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const fs=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
  const m=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
  const app=getApps().length?getApps()[0]:initializeApp(cfg);
  const db=fs.getFirestore(app),auth=m.getAuth(app);au={auth,m};
  unsubA=m.onAuthStateChanged(auth,u=>{
   unsubS&&unsubS();cloud=null;
   if(!u){$('cloud').textContent='🔒 未登入（僅本機儲存）';$('lg').textContent='🔐 Google 登入';return}
   $('lg').textContent='登出 '+(u.email||'');
   const ref=fs.doc(db,'users',u.uid,'data','main');cloud={ref,set:fs.setDoc};
   unsubS=fs.onSnapshot(ref,snap=>{
    if(!snap.exists()){if(S.students.length)save();return}
    const d=snap.data();$('cloud').textContent='☁️ 已連線（'+(u.email||'')+'）';
    if(!snap.metadata.hasPendingWrites&&d.updated>S.updated&&!busy){S=JSON.parse(d.data);localStorage.setItem('cls_data',d.data);render()}
   },e=>{$('cloud').textContent='☁️ 連線錯誤';toast(e.message,4000)});
  });
 }catch(e){$('cloud').textContent='☁️ 設定有誤';toast('firebaseConfig 解析失敗：'+e.message,4000)}
}

// ---------- Gemini ----------
async function gem(p){
 if(!C.key)throw new Error('請先在「設定」輸入 Gemini API Key');
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${C.model||'gemini-2.5-flash'}:generateContent?key=${encodeURIComponent(C.key)}`,
  {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:p}]}],generationConfig:{temperature:.85}})});
 const j=await r.json();if(j.error)throw new Error(j.error.message);
 return j.candidates[0].content.parts.map(x=>x.text).join('').trim();
}
function prompt(s,k,words){
 const h=F.filter(([f])=>f!==k&&s.fields[f]).map(([f,l])=>`【${l}】${s.fields[f]}`).join('\n')||'（尚無歷史紀錄）';
 const st=S.styles.slice(-6).map((x,i)=>`範本${i+1}（${x.t}）：${x.text}`).join('\n')||'（尚無範本，請用溫暖、具體的導師口吻）';
 const kind=k==='grad'?'畢業卡片留言':k.startsWith('c')?'春節祝福卡片':'學期末評語';
 return `你是一位溫暖細心的國小導師，請為學生「${s.name||'座號'+s.no}」撰寫「${L(k)}」（${kind}）。
【老師過去的風格範本，請模仿口吻與用字習慣】\n${st}
【該生歷史紀錄，僅供參考脈絡；請延續成長軌跡，但絕對不要重複其中的句子或相同開頭與結尾】\n${h}
【本次老師想強調的重點】\n${words||'（老師未提供，請依歷史紀錄合理發揮，勿捏造具體事件）'}
要求：繁體中文；120~180字；具體、溫暖、自然；以一段文字輸出；不要標題、不要列點、不要加引號；不捏造老師未提供的具體事實。直接輸出內容。`;
}
function learn(text,k){if(!S.styles.some(x=>x.text===text))S.styles.push({t:L(k),text});S.styles=S.styles.slice(-20)}

// ---------- 畫面 ----------
function tagsHTML(){
 return Object.entries(S.tags).map(([c,v])=>`<div class="mt-1"><span class="text-xs text-stone-500">${esc(c)}</span><br>`+
  v.list.map((t,i)=>`<span class="chip" style="background:${v.color}" onclick="A.tag('${esc(c)}',${i})">${esc(t)}${edit?`<b onclick="event.stopPropagation();A.del('${esc(c)}',${i})"> ×</b>`:''}</span>`).join('')+`</div>`).join('')+
  `<div class="mt-2 flex gap-1"><input id="nt" class="inp" placeholder="新增拼圖"><select id="nc" class="inp" style="width:6rem">${Object.keys(S.tags).map(c=>`<option>${esc(c)}</option>`).join('')}</select><button class="btn" onclick="A.addTag()">＋</button><button class="btn gray" onclick="A.edit()">✎</button></div>`;
}
const tOpts=()=>`<select class="inp" onchange="A.btag(KEY,this)"><option value="">＋拼圖</option>${Object.entries(S.tags).map(([c,v])=>`<optgroup label="${esc(c)}">${v.list.map(t=>`<option>${esc(t)}</option>`).join('')}</optgroup>`).join('')}</select>`;
const tgtSel=()=>`<select class="inp" onchange="A.tgt(this.value)">${T.map(([k,l])=>`<option value="${k}" ${k===tgt?'selected':''}>${l}</option>`).join('')}</select>`;

function render(){
 $('tabs').innerHTML=[['one','👤 單人模式'],['batch','📋 全班批量總表']].map(([k,l])=>`<span class="tab ${view===k?'on':''}" onclick="A.view('${k}')">${l}</span>`).join(' ');
 if(!S.students.length){$('app').innerHTML=`<div class="card text-center py-10">還沒有學生名單。請按右上角「⚙ 設定」貼上名單（每行一位）。</div>`;return}
 if(cur>=S.students.length)cur=0;
 view==='one'?renderOne():renderBatch();
}
function renderOne(){
 const s=S.students[cur];
 $('app').innerHTML=`<div class="grid lg:grid-cols-3 gap-4">
 <section class="card space-y-2"><h2 class="font-bold">① 學生與欄位</h2>
  <select class="inp" onchange="A.pick(+this.value)">${S.students.map((x,i)=>`<option value="${i}" ${i===cur?'selected':''}>${x.no} 號 ${esc(x.name)}</option>`).join('')}</select>
  ${tgtSel()}
  <div class="max-h-56 overflow-auto">${F.map(([k,l])=>`<div class="hist"><b>${l}</b><br>${s.fields[k]?esc(s.fields[k]):'<span class="text-stone-400">（空）</span>'}</div>`).join('')}${s.fields.grad?`<div class="hist"><b>六年級畢業卡片</b><br>${esc(s.fields.grad)}</div>`:''}</div>
  <h3 class="font-semibold text-sm">🧩 拼圖標籤（點選加入下方輸入框）</h3>${tagsHTML()}
  <textarea id="extra" rows="4" class="inp" placeholder="本次補充重點（可點拼圖、也可手動輸入）" oninput="extraT=this.value">${esc(extraT)}</textarea>
  <button class="btn w-full" id="gb" onclick="A.gen()" ${busy?'disabled':''}>✨ 呼叫 AI 生成初稿</button></section>
 <section class="card"><h2 class="font-bold mb-2">② AI 初稿</h2><div class="whitespace-pre-wrap text-sm min-h-[12rem] bg-[#f3eee2] rounded-xl p-3">${draft?esc(draft):'<span class="text-stone-400">尚未生成。選好學生、欄位與拼圖後按左側按鈕。</span>'}</div>
  <button class="btn blue mt-2" onclick="A.useDraft()">→ 重新套用初稿到編輯區</button></section>
 <section class="card space-y-2"><h2 class="font-bold">③ 編輯與存檔：${L(tgt)}</h2>
  <textarea id="edit" rows="14" class="inp" oninput="editT=this.value;$('cnt').textContent=this.value.length">${esc(editT)}</textarea>
  <div class="text-xs text-stone-500"><span id="cnt">${editT.length}</span> 字</div>
  <button class="btn alt w-full" onclick="A.saveOne()">💾 確認存檔 &amp; 訓練 AI</button></section></div>`;
}
function renderBatch(){
 $('app').innerHTML=`<div class="card"><div class="flex flex-wrap gap-2 items-center mb-3"><span class="font-bold">目標欄位</span><div class="w-52">${tgtSel()}</div>
 <button class="btn" id="ga" onclick="A.genAll()">🚀 一鍵生成全班初稿</button><button class="btn alt" onclick="A.saveAll()">💾 全班一鍵確認存檔</button><span id="prog" class="text-sm text-stone-500"></span></div>
 <div class="overflow-auto max-h-[75vh]"><table class="w-full text-sm"><thead><tr><th>座號/姓名</th><th>歷史摘要</th><th style="width:20%">本次關鍵字 / 拼圖</th><th style="width:38%">AI 初稿（可直接編輯）</th></tr></thead><tbody>
 ${S.students.map((s,i)=>{if(bd[i]===undefined)bd[i]=s.fields[tgt]||'';
  const last=F.filter(([f])=>f!==tgt&&s.fields[f]).slice(-2).map(([f,l])=>`<div class="hist"><b>${l}</b> ${esc(s.fields[f].slice(0,50))}…</div>`).join('')||'<span class="text-stone-400">（無）</span>';
  return `<tr><td class="whitespace-nowrap font-semibold">${s.no} ${esc(s.name)}</td><td>${last}</td>
  <td><input id="k${i}" class="inp mb-1" value="${esc(kw[i]||'')}" oninput="kw[${i}]=this.value">${tOpts().replace('KEY',i)}</td>
  <td><textarea id="d${i}" rows="4" class="inp" oninput="bd[${i}]=this.value">${esc(bd[i])}</textarea></td></tr>`}).join('')}
 </tbody></table></div></div>`;
}

// ---------- 動作 ----------
const A=window.A={
 view(v){view=v;render()},
 async login(){if(!au)return toast('請先在「設定」貼上 firebaseConfig');
  try{au.auth.currentUser?await au.m.signOut(au.auth):await au.m.signInWithPopup(au.auth,new au.m.GoogleAuthProvider())}catch(e){toast('登入失敗：'+e.message,5000)}},
 pick(i){cur=i;draft='';editT=S.students[i].fields[tgt]||'';render()},
 tgt(k){tgt=k;draft='';bd={};editT=S.students[cur]?.fields[k]||'';render()},
 tag(c,i){const t=S.tags[c].list[i];extraT+=(extraT?'、':'')+t;$('extra').value=extraT},
 btag(i,el){if(!el.value)return;kw[i]=(kw[i]?kw[i]+'、':'')+el.value;$('k'+i).value=kw[i];el.value=''},
 edit(){edit=!edit;render()},
 del(c,i){S.tags[c].list.splice(i,1);save();render()},
 addTag(){const t=$('nt').value.trim();if(!t)return;S.tags[$('nc').value].list.push(t);save();render()},
 async gen(){
  const s=S.students[cur];busy=true;$('gb').disabled=true;$('gb').textContent='⏳ AI 撰寫中…';
  try{draft=await gem(prompt(s,tgt,extraT));editT=draft}catch(e){toast('生成失敗：'+e.message,4000)}
  busy=false;render();
 },
 useDraft(){if(draft){editT=draft;render()}},
 saveOne(){
  if(!editT.trim())return toast('編輯區是空的');
  S.students[cur].fields[tgt]=editT.trim();learn(editT.trim(),tgt);save();render();toast('✅ 已存檔，並加入風格範本')},
 async genAll(){
  busy=true;$('ga').disabled=true;let ok=0;
  for(let i=0;i<S.students.length;i++){
   $('prog').textContent=`生成中 ${i+1}/${S.students.length}…`;
   try{bd[i]=await gem(prompt(S.students[i],tgt,kw[i]||''));$('d'+i).value=bd[i];ok++}
   catch(e){$('d'+i).value=bd[i]||'';toast(`${S.students[i].no} 號失敗：${e.message}`,3000);await new Promise(r=>setTimeout(r,1500))}
  }
  busy=false;$('ga').disabled=false;$('prog').textContent=`完成 ${ok}/${S.students.length}`;
 },
 saveAll(){
  let n=0;S.students.forEach((s,i)=>{const t=(bd[i]||'').trim();if(t){s.fields[tgt]=t;learn(t,tgt);n++}});
  save();toast(`✅ 已存入 ${n} 位學生的「${L(tgt)}」`)},
 cfg(show){
  if(show){$('c_key').value=C.key||'';$('c_model').value=C.model||'';$('c_fb').value=C.fb||'';$('c_roster').value=S.students.map(s=>s.name).join('\n')}
  $('modal').classList.toggle('hidden',!show)},
 saveCfg(){
  C={key:$('c_key').value.trim(),model:$('c_model').value.trim(),fb:$('c_fb').value.trim()};
  localStorage.setItem('cls_cfg',JSON.stringify(C));
  const names=$('c_roster').value.split('\n').map(x=>x.trim()).filter(Boolean);
  S.students=names.map((n,i)=>({no:i+1,name:n,fields:S.students[i]?.fields||{}}));
  bd={};save();A.cfg(false);render();initCloud();toast('設定已儲存')},
 exp(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
  a.download=`班級評語備份_${new Date().toISOString().slice(0,10)}.json`;a.click()},
 imp(el){
  const f=el.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.students)throw new Error('格式不符');S=d;save();bd={};render();toast('匯入完成')}catch(e){toast('匯入失敗：'+e.message)}};
  r.readAsText(f);el.value=''},
 arch(){
  if(!confirm('畢業封存：將先下載完整備份，再清空所有學生資料（拼圖庫與風格範本會保留）。確定？'))return;
  A.exp();S.students=[];bd={};kw={};draft=editT='';save();render();toast('已封存並清空，請到「設定」貼上新名單')}
};
render();initCloud();
</script>
</body></html>
